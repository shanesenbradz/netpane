name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller==6.11.1 psutil==6.1.0

      - name: Build NetPane.exe
        run: >
          pyinstaller --onefile --console --name NetPane
          --icon packaging/netpane.ico
          --version-file packaging/version.txt
          netpane.py

      - name: Test the exe on Windows
        run: python packaging/smoke_test.py dist/NetPane.exe

      - name: Upload NetPane.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetPane-windows
          path: dist/NetPane.exe
          if-no-files-found: ignore

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetPane.exe
